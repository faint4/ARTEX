name: Bug（缺陷）
description: 报告缺陷。走轻量路径：修复 PR 需附回归测试 + 根因说明（可免 spec.md）。
labels: [type:bug]
body:
  - type: textarea
    id: repro
    attributes:
      label: 复现步骤
      description: 最小复现路径（操作 → 期望 → 实际）
      placeholder: |
        1. 打开 ...
        2. 点击 ...
        期望: ...
        实际: ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: 含错误信息 / 日志片段（注意脱敏，勿贴密钥）
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本与环境
      placeholder: 如 v0.9.2 / Docker / WSL / Windows
    validations:
      required: true
  - type: textarea
    id: root-cause
    attributes:
      label: 根因假设（可选）
      description: 若已知可疑代码位置，给出文件/行号；修复 PR 中必须给出确切根因
